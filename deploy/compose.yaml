# Serviço do acervo-hub para um stack Compose existente. Um processo só: serve
# o Torznab e a interface e agenda as tarefas, inclusive o ciclo de limpeza.
#
# A tag `main` acompanha o último build da branch principal. `latest` só nasce
# em tag semver (`v*`). Para fixar uma versão, troque por `:vX.Y.Z` ou digest.
#
# Toda a configuração mora no Postgres e se edita na interface (Configurações,
# Aplicativos, Tarefas). Fora do banco, só o ambiente abaixo.

services:
  # Os gerenciadores o alcançam pela rede `media` em
  # `http://acervo-hub-indexadores:9797/<indexador>` — que é o "Endereço
  # público" a pôr em Configurações → Servidor.
  #
  # Cadastrar os indexadores nos gerenciadores (simula sem `--apply`; também
  # há o botão em Aplicativos):
  #   docker compose run --rm acervo-hub-indexadores sync --apply
  #
  # Contas da interface (a senha vem da entrada padrão):
  #   echo 'senha-longa' | docker compose run --rm -T acervo-hub-indexadores users set admin
  acervo-hub-indexadores:
    image: ghcr.io/vitoramaral10/acervo-hub:main
    user: "65532:65532"
    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

    mem_limit: 128m
    pids_limit: 64
    cpus: "0.50"

    environment:
      # Obrigatória. Guarda a senha do banco: prefira um `.env` fora do
      # versionamento (`ACERVO_DATABASE_URL=postgres://...` lá) a escrevê-la
      # aqui.
      ACERVO_DATABASE_URL: ${ACERVO_DATABASE_URL:?defina ACERVO_DATABASE_URL}
      # Padrão `0.0.0.0:9797`: dentro do container, `127.0.0.1` não seria
      # alcançável pelos vizinhos.
      # ACERVO_BIND: 0.0.0.0:9797

    volumes:
      # Definições Cardigann, se houver: o diretório vai em Configurações →
      # Servidor → "Diretórios de definições".
      - ./definicoes:/etc/acervo-hub/definicoes:ro

    command: ["serve"]

    # A interface web (e a API Torznab) só na própria máquina: de fora, por
    # túnel SSH ou atrás de um proxy com TLS.
    ports:
      - 127.0.0.1:9797:9797

    networks: [media]

networks:
  media:
    external: true
