# Serviço do acervo-hub para um stack Compose existente. Um processo só: serve
# o Torznab e a interface e agenda as tarefas, inclusive o ciclo de limpeza.
#
# A tag `main` acompanha o último build da branch principal. `latest` só nasce
# em tag semver (`v*`). Para fixar uma versão, troque por `:vX.Y.Z` ou digest.

services:
  # Sobe com o resto do stack. Os gerenciadores o alcançam pela rede `media` em
  # `http://acervo-hub-indexadores:9797/<indexador>`; nenhuma porta vai para o
  # host, porque a chave dá acesso a links com passkey.
  #
  # Em `config.toml`, `[server] bind = "0.0.0.0:9797"` — dentro do container,
  # o padrão `127.0.0.1` não seria alcançável pelos vizinhos.
  #
  # Cadastrar os indexadores nos gerenciadores (simula sem `--apply`):
  #   docker compose run --rm acervo-hub-indexadores \
  #       -c /etc/acervo-hub/config.toml sync --apply
  acervo-hub-indexadores:
    image: ghcr.io/vitoramaral10/acervo-hub:main
    user: "65532:65532"
    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

    mem_limit: 128m
    pids_limit: 64
    cpus: "0.50"

    volumes:
      - ./config.toml:/etc/acervo-hub/config.toml:ro
      # Definições Cardigann, se houver. Não precisa do acervo.
      - ./definicoes:/etc/acervo-hub/definicoes:ro
      # Credenciais trocadas pela interface web. Com
      # `[state] credentials = "/var/lib/acervo-hub/credenciais.toml"` no
      # config; o diretório precisa ser do UID do container.
      - ./state:/var/lib/acervo-hub

    command: ["-c", "/etc/acervo-hub/config.toml", "serve"]

    # A interface web (e a API Torznab) só na própria máquina: de fora, por
    # túnel SSH ou atrás de um proxy com TLS.
    ports:
      - 127.0.0.1:9797:9797

    networks: [media]

networks:
  media:
    external: true
