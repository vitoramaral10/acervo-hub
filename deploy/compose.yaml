# Serviço do acervo-hub para um stack Compose existente. Um processo só:
# serve a interface e agenda as tarefas — busca, RSS, importação, metadados,
# limpeza, assistidos.
#
# A tag `main` acompanha o último build da branch principal. `latest` só nasce
# em tag semver (`v*`). Para fixar uma versão, troque por `:vX.Y.Z` ou digest.
#
# Toda a configuração mora no Postgres e se edita na interface (Configurações,
# Tarefas). Fora do banco, só o ambiente abaixo.

services:
  # Contas da interface (a senha vem da entrada padrão):
  #   echo 'senha-longa' | docker compose run --rm -T acervo-hub users set admin
  acervo-hub:
    image: ghcr.io/vitoramaral10/acervo-hub:main
    user: "65532:65532"
    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

    mem_limit: 128m
    pids_limit: 64
    cpus: "0.50"

    environment:
      # Obrigatória. Guarda a senha do banco: prefira um `.env` fora do
      # versionamento (`ACERVO_DATABASE_URL=postgres://...` lá) a escrevê-la
      # aqui.
      ACERVO_DATABASE_URL: ${ACERVO_DATABASE_URL:?defina ACERVO_DATABASE_URL}
      # Padrão `0.0.0.0:9797`: dentro do container, `127.0.0.1` não seria
      # alcançável pelos vizinhos.
      # ACERVO_BIND: 0.0.0.0:9797

    volumes:
      # A biblioteca e os downloads, no mesmo sistema de arquivos: a
      # importação liga o arquivo baixado na pasta do filme ou da série por
      # hardlink. O caminho de cada lado se acerta em Configurações →
      # Biblioteca.
      - /srv/media:/media
      # Definições Cardigann próprias, se houver: o diretório vai em
      # Configurações → Servidor → "Diretórios locais de definições".
      - ./definicoes:/etc/acervo-hub/definicoes:ro

    command: ["serve"]

    # A imagem não tem curl: o próprio binário pergunta a `/health/ready`
    # (banco, cliente de download e espaço livre acima da folga das regras).
    # Cliente de download não configurado não reprova.
    healthcheck:
      test: ["CMD", "/usr/local/bin/acervo-hub", "healthcheck"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s

    # O desligamento espera por até 25 s as tarefas em execução; o padrão de
    # 10 s do Docker mataria o serviço no meio delas.
    stop_grace_period: 30s

    # A interface só na própria máquina: de fora, por túnel SSH ou atrás de
    # um proxy com TLS.
    ports:
      - 127.0.0.1:9797:9797

    networks: [media]

networks:
  media:
    external: true
