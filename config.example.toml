# Exemplo de configuração do acervo-hub.
#
# Guarda chave de API e senha em texto puro: use `chmod 600`. O binário avisa
# no log se o arquivo estiver legível por outros usuários.
#
# Campo escrito errado é erro, não é ignorado — uma trava de segurança caindo
# no padrão em silêncio é pior do que a configuração não subir.

# Timeout de cada chamada HTTP, em segundos.
http_timeout_seconds = 30

[qbittorrent]
url = "http://localhost:8080"
username = "USUARIO"
password = "SENHA"

# Uma entrada por instância. `kind` é "series" ou "movie" e decide qual campo
# da fila aponta para a obra — ler o campo do outro produto esconderia órfão.
[[instances]]
name = "series"
kind = "series"
url = "http://localhost:8989"
api_key = "CHAVE_DA_API"

# Caminho como o CLIENTE DE DOWNLOAD o vê → caminho no host onde o acervo-hub
# roda. Sem isso, o `stat` cairia no lugar errado da árvore do host. Omitir a
# seção inteira só funciona se ambos enxergam a mesma árvore.
[paths]
"/media" = "/mnt/acervo"

# Raízes da biblioteca, no host. Servem para medir o acervo, que é o
# denominador da trava proporcional. Biblioteca medindo zero aborta o ciclo.
[library]
roots = ["/mnt/acervo/series", "/mnt/acervo/movies"]

[policy]
# Execuções consecutivas em que um item precisa aparecer como órfão antes de
# sair. Um strike por ciclo, sem janela de espera.
orphan_strikes = 3

# Apagar também os ARQUIVOS de órfão em tracker privado. Com `false`, o item
# sai da fila e o torrent fica — conservador por padrão.
delete_private_orphans = false

# Órfão de fila cujo torrent não está mais no cliente: pular em vez de agir.
skip_orphan_if_missing_in_client = true

# Carência de seed para torrent privado que perdeu o vínculo com a biblioteca.
# `0` desliga a carência e apaga no ciclo seguinte — rápido, mas expõe a
# hit&run se o torrent for recente.
private_seed_grace_hours = 120

# Arquivo mexido dentro desta janela nunca é apagado.
recent_change_grace_hours = 24

# Travas de lote. Estourar qualquer uma aborta o ciclo INTEIRO sem apagar nada,
# em vez de apagar "só um pouco".
max_batch_gib = 300
max_batch_fraction = 0.30

# Categorias do cliente que o gerenciador de séries e o acervo usam. Só seed
# nelas pode ser apagado por ter perdido o hardlink; o resto é download manual e
# nunca é tocado. Vazia, essa regra não apaga nada.
managed_categories = ["tv-sonarr", "acervo"]

[state]
# Onde os strikes sobrevivem ao reinício do processo. Sem isso, três strikes
# nunca se completam.
ledger = "~/.local/state/acervo-hub/strikes.json"

# Postgres do catálogo de filmes e das contas da interface. As tabelas são
# criadas na primeira conexão; filmes entram pela tela (ou `acervo-hub movies
# add`), e `acervo-hub movies check` confere cada arquivo contra o disco.
# Contas da interface:
#   echo 'senha-longa' | acervo-hub users set <nome>
# Sem esta seção, `serve` sobe e serve os indexadores, mas ninguém entra pela
# tela — só a chave de API no cabeçalho `X-Api-Key`.
[database]
url = "postgres://acervo:TROQUE@localhost:5432/acervo"

# Grab e importação de filmes pelo acervo-hub (`movies grab`, "Pegar agora").
# O torrent vai ao `[qbittorrent]` nesta categoria, separada da do gerenciador
# para ele não tentar importar o que não pegou — ponha-a também em
# `policy.managed_categories`, para a limpeza cuidar do seed depois. `serve`
# importa os downloads concluídos a cada `import_interval_minutes` (0 desliga):
# hardlink na pasta do filme, então download e biblioteca precisam estar no
# mesmo disco, e o serviço precisa de escrita na biblioteca.
[movies]
category = "acervo"
import_interval_minutes = 5
# Pastas raiz dos filmes, como os gerenciadores as veem: a API v3 as oferece
# aos apps de pedidos, com o espaço livre de cada uma.
root_folders = ["/media/movies"]
# De quanto em quanto tempo ler os releases recentes de todos os indexadores
# e pegar o que serve à biblioteca.
rss_interval_minutes = 30
# Todo torrent entra parado, com a tag `acervo:fila`; o acervo liga a
# pré-alocação no qBittorrent e inicia da fila, do menor para o maior, os que
# cabem no espaço livre.

# --- Superfície Torznab (`acervo-hub serve`) --------------------------------
#
# Nada abaixo é lido por `apply`, e nada acima é exigido por `serve` — sem o
# que está acima, `serve` só não roda a limpeza. Um arquivo só serve aos dois.
#
# `acervo-hub sync --apply` cadastra cada indexador nas `[[instances]]` acima,
# com as categorias certas para cada uma. À mão, seria um indexador Torznab
# com URL `http://<host>:9797/<nome>` e a chave abaixo como API key.

[server]
# Em container, `0.0.0.0:9797`. Fora dele, o padrão só aceita a própria máquina.
bind = "127.0.0.1:9797"
# Ao menos 16 caracteres. Quem tem a chave recebe links de download com passkey.
api_key = "TROQUE_POR_UMA_CHAVE_LONGA"
# Como os gerenciadores alcançam este serviço. É o endereço que `sync`
# cadastra neles; em Compose, o nome do serviço na rede interna.
public_url = "http://acervo-hub-indexadores:9797"
# Diretórios de definições Cardigann que a interface oferece em "Adicionar
# indexador" — por exemplo, o Definitions do agregador atual. As que o
# executor ainda não roda aparecem com o motivo.
catalogs = ["/etc/acervo-hub/definicoes", "/etc/acervo-hub/catalogo"]
# Busca dos filmes que faltam: a cada tantos minutos, busca `search_limit`
# filmes sem arquivo (os há mais tempo sem busca primeiro) e pega o escolhido.
# O botão "Buscar os que faltam" da tela busca todos de uma vez. Roda
# aqui, e não num processo à parte, para dividir com o gerenciador de séries a
# sessão e as consultas guardadas (cada tracker vê uma requisição por consulta).
# search_interval_minutes = 120
# search_limit = 5
# Ciclo de limpeza (tudo de `[qbittorrent]` a `[policy]` acima), rodado pelo
# próprio serviço como a tarefa "Limpeza": a cada tantos minutos, e no
# "rodar agora" da tela Tarefas. 0 desliga o agendamento. A primeira volta
# espera um intervalo inteiro: reiniciar o serviço não conta como ciclo.
cleanup_interval_minutes = 60

# Apagar assistidos: a tarefa "Apagar assistidos" lê do Jellyfin os filmes que
# algum usuário assistiu e, passada a carência desde a última vez que alguém
# assistiu, REMOVE o filme do acervo — catálogo, pasta e o download semeando,
# sem simulação. Filme favorito de qualquer usuário fica; assistido sem data
# conhecida também. Casa com o catálogo pelo id do TMDB. A chave é uma chave
# de API do Jellyfin (Painel → Chaves de API); a varredura da biblioteca, pedida
# depois de apagar, exige chave de administrador. Sem esta seção, a tarefa não
# existe. `interval_minutes = 0` deixa só o "rodar agora".
# [jellyfin]
# url = "http://jellyfin:8096"
# api_key = "CHAVE_DA_API"
# delete_watched_after_minutes = 60
# interval_minutes = 15

# Endpoint Torznab existente — por exemplo, o feed de um indexador no agregador
# atual. As capacidades são lidas no início; se ele não responder, fica fora do
# catálogo até o próximo reinício, sem derrubar os outros.
[[indexers]]
kind = "torznab"
name = "agregador-atual"
url = "http://localhost:9696/1/api"
api_key = "CHAVE_DA_API"
request_interval_seconds = 2.0

# Definição Cardigann v11 executada aqui mesmo, no formato do diretório de
# definições do agregador atual. Definição com recurso fora do subconjunto
# implementado é recusada na subida, com o motivo.
[[indexers]]
kind = "cardigann"
definition = "/etc/acervo-hub/definicoes/publico.yml"
link = 0
settings = { }

# Tracker privado: `settings` leva o que a definição declara — usuário e senha
# para login por formulário, ou o cookie da sessão para login por cookie. Os
# links de download saem apontando para este serviço, que baixa o .torrent com
# a sessão; o cliente de download nunca vê a credencial.
[[indexers]]
kind = "cardigann"
definition = "/etc/acervo-hub/definicoes/privado.yml"
settings = { username = "USUARIO", password = "SENHA" }
