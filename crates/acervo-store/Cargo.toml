[package]
name = "acervo-store"
version = "0.0.0"
description = "Catálogo persistente do acervo-hub: filmes, arquivos, perfis de qualidade e contas da interface, em Postgres."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acervo-parser.workspace = true
argon2.workspace = true
deadpool-postgres.workspace = true
