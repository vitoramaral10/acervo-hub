[workspace]
resolver = "3"
members = [
    "crates/acervo-core",
    "crates/acervo-janitor",
    "crates/acervo-fs",
    "crates/acervo-arr",
    "crates/acervo-clients",
    "crates/acervo-indexers",
    "crates/acervo-api",
    "crates/acervo-parser",
    "crates/acervo-store",
    "crates/acervo-decision",
    "crates/acervo-metadata",
    "crates/acervo-hub",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/vitoramaral10/acervo-hub"

[workspace.dependencies]
acervo-core = { path = "crates/acervo-core" }
acervo-janitor = { path = "crates/acervo-janitor" }
acervo-fs = { path = "crates/acervo-fs" }
acervo-arr = { path = "crates/acervo-arr" }
acervo-clients = { path = "crates/acervo-clients" }
acervo-indexers = { path = "crates/acervo-indexers" }
acervo-api = { path = "crates/acervo-api" }
acervo-parser = { path = "crates/acervo-parser" }
acervo-store = { path = "crates/acervo-store" }
acervo-decision = { path = "crates/acervo-decision" }
acervo-metadata = { path = "crates/acervo-metadata" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
clap = { version = "4", features = ["derive"] }
# Lookaround e backreference, que os padrões portados do parser de release
# usam e o `regex` não tem. Rust puro: o build estático musl continua.
fancy-regex = "0.19"
unicode-normalization = "0.1"
futures = "0.3"
quick-xml = "0.38"
# Postgres em Rust puro, sem libpq: o build estático musl continua. Sem TLS
# porque o banco fica na rede interna do Docker.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
# Infohash de torrent v1: SHA-1 do dicionário `info`.
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
    "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
scraper = "0.24"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
time = { version = "0.3", features = ["parsing"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# Só de desenvolvimento: sobe um servidor HTTP que responde o que os produtos
# reais respondem, para os testes de contrato dos adaptadores.
wiremock = "0.6"

[profile.release]
# O binário vai para uma imagem distroless: símbolo de debug ali só ocupa
# espaço, e `lto` com uma unidade de codegen paga em tamanho o que custa em
# tempo de build — que fica no cache mount de qualquer forma.
strip = "symbols"
lto = true
codegen-units = 1

# Hash sem otimização leva segundos: o argon2 das senhas e o SCRAM de cada
# conexão com o Postgres deixariam os testes lentos à toa. Só esses pacotes
# compilam otimizados no perfil de dev.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.postgres-protocol]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
