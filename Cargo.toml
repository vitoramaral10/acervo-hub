[workspace]
resolver = "3"
members = [
    "crates/acervo-core",
    "crates/acervo-janitor",
    "crates/acervo-fs",
    "crates/acervo-arr",
    "crates/acervo-clients",
    "crates/acervo-indexers",
    "crates/acervo-hub",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/vitoramaral10/acervo-hub"

[workspace.dependencies]
acervo-core = { path = "crates/acervo-core" }
acervo-janitor = { path = "crates/acervo-janitor" }
acervo-fs = { path = "crates/acervo-fs" }
acervo-arr = { path = "crates/acervo-arr" }
acervo-clients = { path = "crates/acervo-clients" }
acervo-indexers = { path = "crates/acervo-indexers" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
scraper = "0.24"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
time = { version = "0.3", features = ["parsing"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# Só de desenvolvimento: sobe um servidor HTTP que responde o que os produtos
# reais respondem, para os testes de contrato dos adaptadores.
wiremock = "0.6"

[profile.release]
# O binário vai para uma imagem distroless: símbolo de debug ali só ocupa
# espaço, e `lto` com uma unidade de codegen paga em tamanho o que custa em
# tempo de build — que fica no cache mount de qualquer forma.
strip = "symbols"
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
