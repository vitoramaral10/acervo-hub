name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    # Os testes do catálogo e das contas rodam contra um Postgres de verdade;
    # sem `ACERVO_TEST_DATABASE_URL` eles avisam e passam.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACERVO_TEST_DATABASE_URL: postgres://postgres:teste@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets

      - name: Testes
        run: cargo test --workspace

  # O build do front é versionado em crates/acervo-api/src/ui/dist para que
  # `cargo build` e a imagem não precisem de Node. Este job garante que ele
  # corresponde ao código em web/: quem muda o front sem recompilar é pego aqui.
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dependências
        run: npm ci --prefix web

      - name: Tipos e build
        run: npm run --prefix web build

      - name: Build versionado em dia
        run: git diff --exit-code -- crates/acervo-api/src/ui/dist

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Lint do frontend do BuildKit, sem construir nada.
      - name: Conferir o Dockerfile
        run: docker build --check .

      # Constrói sem publicar: garante que o Dockerfile continua válido a cada
      # mudança nos crates, e não só na hora do release.
      - uses: docker/build-push-action@v6
        with:
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
