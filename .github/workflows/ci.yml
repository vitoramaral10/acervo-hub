name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets

      - name: Testes
        run: cargo test --workspace

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Lint do frontend do BuildKit, sem construir nada.
      - name: Conferir o Dockerfile
        run: docker build --check .

      # Constrói sem publicar: garante que o Dockerfile continua válido a cada
      # mudança nos crates, e não só na hora do release.
      - uses: docker/build-push-action@v6
        with:
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
